<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini OBS Web Studio - Pro V15</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        #outputCanvas { touch-action: none; } 
        
        /* Scene Button Styling */
        .scene-btn {
            background-color: #374151; /* gray-700 */
            color: #d1d5db; /* gray-300 */
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            display: flex;
            align-items: center;
        }
        .scene-btn:hover { background-color: #4b5563; }
        .scene-btn.active {
            background-color: #2563eb; /* blue-600 */
            color: #ffffff;
            border-left: 4px solid #93c5fd; /* blue-300 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased h-[100dvh] flex flex-col overflow-hidden">

    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md flex-shrink-0 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center w-full">
            <h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-video text-red-500 mr-2"></i>Mini OBS Studio V15</h1>
            <div id="statusBadge" class="px-3 py-1 bg-gray-700 text-xs rounded-full font-semibold text-gray-300 border border-gray-600">
                <i class="fa-solid fa-circle text-gray-500 mr-1 text-[10px]"></i> Standby
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row gap-4 p-4 overflow-hidden h-full max-w-7xl mx-auto w-full">
        
        <div class="w-full md:w-5/12 lg:w-1/2 flex flex-col gap-4 h-full">
            
            <div class="bg-black rounded-lg overflow-hidden shadow-lg border border-gray-700 relative aspect-video w-full flex-shrink-0">
                <video id="videoSource" playsinline muted class="hidden"></video>
                <video id="muqoddimahVideoSource" playsinline class="hidden"></video>
                <video id="introVideoSource" playsinline class="hidden"></video>
                <video id="pauseVideoSource" playsinline class="hidden"></video>
                <video id="outroVideoSource" playsinline class="hidden"></video>
                
                <canvas id="outputCanvas" class="w-full h-full object-contain bg-gray-900 cursor-move"></canvas>
                
                <div id="camOffPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none hidden">
                    <i class="fa-solid fa-camera-slash text-6xl text-gray-700 mb-4"></i>
                    <p class="text-gray-500 font-semibold" id="camPlaceholderText">Kamera Belum Aktif</p>
                </div>
            </div>

            <div class="bg-gray-800 rounded-lg border border-gray-700 p-4 flex flex-col flex-grow overflow-y-auto custom-scrollbar shadow-md">
                <h2 class="text-lg font-semibold mb-3 border-b border-gray-600 pb-2"><i class="fa-solid fa-layer-group mr-2"></i>Pilih Scene</h2>
                <div class="flex flex-col gap-2">
                    <button onclick="changeScene('muqoddimah')" id="btnSceneMuqoddimah" class="scene-btn w-full">
                        <i class="fa-solid fa-book-open w-6 text-center mr-2"></i>Muqoddimah
                    </button>
                    <button onclick="changeScene('intro')" id="btnSceneIntro" class="scene-btn w-full">
                        <i class="fa-solid fa-hourglass-start w-6 text-center mr-2"></i>Intro
                    </button>
                    <button onclick="changeScene('live')" id="btnSceneLive" class="scene-btn active w-full">
                        <i class="fa-solid fa-camera w-6 text-center mr-2"></i>Live Camera
                    </button>
                    <button onclick="changeScene('pause')" id="btnScenePause" class="scene-btn w-full">
                        <i class="fa-solid fa-pause w-6 text-center mr-2"></i>Pause
                    </button>
                    <button onclick="changeScene('outro')" id="btnSceneOutro" class="scene-btn w-full">
                        <i class="fa-solid fa-flag-checkered w-6 text-center mr-2"></i>Outro
                    </button>
                </div>
            </div>

        </div>

        <div class="w-full md:w-7/12 lg:w-1/2 flex flex-col gap-6 overflow-y-auto h-full pr-2 pb-4 custom-scrollbar">
            
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md flex-shrink-0">
                <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2"><i class="fa-solid fa-sliders mr-2"></i>Sistem & Kamera</h2>
                
                <div class="mb-4 bg-gray-900 p-3 rounded border border-gray-700">
                    <label class="block text-xs font-bold text-gray-400 mb-2"><i class="fa-solid fa-display mr-1"></i> Resolusi Perekaman & Kamera</label>
                    <select id="resolutionSelect" class="w-full bg-gray-800 border border-gray-600 text-white rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 font-semibold cursor-pointer">
                        <option value="480">SD (854x480) - Super Ringan</option>
                        <option value="720" selected>HD (1280x720) - Standar Mulus</option>
                        <option value="1080">Full HD (1920x1080) - Kualitas Tinggi</option>
                        <option value="2160">4K (3840x2160) - Awas HP Panas!</option>
                    </select>
                    <p class="text-[10px] text-yellow-500 mt-2">*Ubah resolusi saat kamera sedang mati.</p>
                </div>

                <div class="flex gap-3 mb-4">
                    <button id="btnStartCam" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-semibold transition shadow"><i class="fa-solid fa-camera mr-2"></i>Nyalakan Kamera</button>
                    <button id="btnStopCam" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-3 rounded font-semibold transition shadow hidden"><i class="fa-solid fa-stop mr-2"></i>Matikan Kamera</button>
                </div>
                <div class="flex gap-3">
                    <button id="btnRecord" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-4 rounded font-bold transition shadow text-lg">
                        <i class="fa-solid fa-record-vinyl mr-2"></i>Mulai Rekam Local
                    </button>
                    <button id="btnStopRecord" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-4 rounded font-bold transition shadow hidden text-lg">
                        <i class="fa-solid fa-square text-red-400 mr-2"></i>Stop & Simpan
                    </button>
                </div>
            </div>

            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md flex-shrink-0">
                <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2"><i class="fa-solid fa-film mr-2"></i>Media Scene (MP4)</h2>
                <div id="mediaInputsContainer" class="space-y-4">
                    </div>
            </div>

            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md flex flex-col flex-shrink-0">
                <div class="flex justify-between items-center mb-4 border-b border-gray-600 pb-2">
                    <h2 class="text-lg font-semibold"><i class="fa-solid fa-images mr-2"></i>Overlay Media & Teks</h2>
                    <button id="btnClearOverlays" class="text-xs bg-red-900 text-red-300 px-3 py-1.5 rounded hover:bg-red-800 transition font-semibold">Hapus Semua</button>
                </div>
                
                <div class="mb-4">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Tambah Gambar (PNG/JPG)</label>
                    <input type="file" id="overlayInput" accept="image/png, image/jpeg, image/gif" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 bg-gray-900 border border-gray-600 rounded cursor-pointer">
                </div>

                <div class="mb-4 border-t border-gray-700 pt-4">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Tambah Teks Manual</label>
                    <div class="flex flex-col gap-3">
                        <input type="text" id="textInput" placeholder="Ketik teks kajian..." class="w-full text-sm bg-gray-900 border border-gray-600 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-white">
                        <div class="flex gap-2 items-center">
                            <select id="fontSelect" class="flex-1 text-sm bg-gray-900 border border-gray-600 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-white cursor-pointer">
                                <option value="sans-serif">Sans-Serif (Bersih)</option>
                                <option value="serif">Serif (Formal/Kitab)</option>
                                <option value="monospace">Monospace</option>
                                <option value="cursive">Cursive (Latin)</option>
                                <option value="system-ui">System UI</option>
                            </select>
                            <input type="color" id="textColor" value="#ffffff" class="w-12 h-11 rounded cursor-pointer border border-gray-600 bg-gray-900 p-1" title="Warna Teks">
                            <button id="btnAddText" class="bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded text-sm font-semibold transition"><i class="fa-solid fa-plus"></i> Tambah</button>
                        </div>
                    </div>
                </div>

                <div class="mb-4 border-t border-gray-700 pt-4">
                    <label class="block text-xs font-medium text-gray-400 mb-2">Timer Kajian (Countup) - HH:MM:SS</label>
                    <div class="flex flex-wrap gap-2 items-center">
                        <button id="btnToggleTimer" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition flex-1 sm:flex-none">
                            <i class="fa-solid fa-play mr-1"></i> Mulai Timer
                        </button>
                        <button id="btnResetTimer" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded text-sm font-semibold transition" title="Reset ke 0">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                        <input type="color" id="timerColor" value="#ffffff" class="w-10 h-9 rounded cursor-pointer border border-gray-600 bg-gray-900 p-1 ml-auto" title="Warna Timer">
                    </div>
                    <div class="mt-3">
                        <label class="flex justify-between text-xs font-medium text-gray-400 mb-1">
                            <span>Transparansi Timer</span>
                            <span id="lblTimerAlpha" class="text-blue-400 font-bold">100%</span>
                        </label>
                        <div class="flex items-center gap-3">
                            <i class="fa-regular fa-eye-slash text-gray-500 text-xs"></i>
                            <input type="range" id="timerAlphaInput" min="0.1" max="1.0" step="0.1" value="1.0" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                            <i class="fa-regular fa-eye text-gray-500 text-xs"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-900 rounded border border-gray-700 p-3 overflow-y-auto max-h-64 min-h-[150px] custom-scrollbar" id="overlayList">
                    <p class="text-sm text-gray-500 text-center mt-4" id="emptyOverlayMsg">Belum ada overlay ditambahkan.</p>
                </div>
            </div>

            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md flex-shrink-0">
                <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Pengaturan Transisi</h2>
                
                <div class="mb-5">
                    <label class="flex justify-between text-sm font-medium text-gray-400 mb-2">
                        <span>Pindah Scene (Fade to Black)</span>
                        <span id="lblSceneSpeed" class="text-blue-400 font-bold">Normal</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-tortoise text-gray-500"></i>
                        <input type="range" id="sceneSpeedInput" min="0.005" max="0.15" step="0.005" value="0.05" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <i class="fa-solid fa-bolt text-gray-500"></i>
                    </div>
                </div>

                <div>
                    <label class="flex justify-between text-sm font-medium text-gray-400 mb-2">
                        <span>Muncul/Hilang Overlay</span>
                        <span id="lblOverlaySpeed" class="text-blue-400 font-bold">Normal</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-tortoise text-gray-500"></i>
                        <input type="range" id="overlaySpeedInput" min="0.01" max="0.3" step="0.01" value="0.1" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <i class="fa-solid fa-bolt text-gray-500"></i>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBNzJkuhAnk0Mwfl5SXzzfWQ48zcSNCulo",
            authDomain: "mini-0bsstreaming.firebaseapp.com",
            databaseURL: "https://mini-0bsstreaming-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "mini-0bsstreaming",
            storageBucket: "mini-0bsstreaming.firebasestorage.app",
            messagingSenderId: "1028240518505",
            appId: "1:1028240518505:web:23ee30697836bf5516a1f8"
        };
        
        const app = initializeApp(firebaseConfig);
        console.log("Firebase & Realtime Database sukses terhubung, Bos!", app.name);
    </script>

    <script>
        // DOM Elements
        const video = document.getElementById('videoSource');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const camOffPlaceholder = document.getElementById('camOffPlaceholder');
        const camPlaceholderText = document.getElementById('camPlaceholderText');
        
        // State Variables untuk Drag & Drop dan Overlay
        let overlays = []; 
        let dragTarget = null; 
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // --- MESIN AUDIO MIXER (WEB AUDIO API) KHUSUS STUDIO BISU ---
        let audioCtx = null;
        let mixedAudioDest = null;
        let micNode = null;
        let mediaNodes = {};

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                mixedAudioDest = audioCtx.createMediaStreamDestination();

                // Sambungkan semua MP4 HANYA ke Mixer Rekaman, BUKAN ke Speaker HP
                Object.keys(mediaScenes).forEach(key => {
                    const vid = mediaScenes[key];
                    vid.muted = false; // Harus false agar ditangkap oleh Web Audio API
                    
                    const node = audioCtx.createMediaElementSource(vid);
                    // KABEL MENUJU SPEAKER KITA CABUT DISINI!
                    node.connect(mixedAudioDest); // 100% Hanya masuk ke alat rekam
                    mediaNodes[key] = node;
                });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- MANAJEMEN RESOLUSI ---
        const resolutionSelect = document.getElementById('resolutionSelect');
        let currentCamWidth = 1280;
        let currentCamHeight = 720;

        function updateResolutionState() {
            const res = parseInt(resolutionSelect.value);
            if (res === 480) { currentCamWidth = 854; currentCamHeight = 480; }
            else if (res === 720) { currentCamWidth = 1280; currentCamHeight = 720; }
            else if (res === 1080) { currentCamWidth = 1920; currentCamHeight = 1080; }
            else if (res === 2160) { currentCamWidth = 3840; currentCamHeight = 2160; }
            
            canvas.width = currentCamWidth;
            canvas.height = currentCamHeight;
        }

        updateResolutionState();

        resolutionSelect.addEventListener('change', () => {
            if(stream) {
                alert("Bos, matikan kamera dulu (klik 'Matikan Kamera') sebelum mengganti resolusi.");
                resolutionSelect.value = currentCamHeight; 
                return;
            }
            updateResolutionState();
        });

        const mediaScenes = {
            muqoddimah: document.getElementById('muqoddimahVideoSource'),
            intro: document.getElementById('introVideoSource'),
            pause: document.getElementById('pauseVideoSource'),
            outro: document.getElementById('outroVideoSource')
        };

        window.mediaState = {
            muqoddimah: { visible: true, alpha: 1.0, fadeSpeed: 0.1 },
            intro: { visible: true, alpha: 1.0, fadeSpeed: 0.1 },
            pause: { visible: true, alpha: 1.0, fadeSpeed: 0.1 },
            outro: { visible: true, alpha: 1.0, fadeSpeed: 0.1 }
        };
        
        const mediaInputsContainer = document.getElementById('mediaInputsContainer');
        const sceneNames = { muqoddimah: 'MUQODDIMAH', intro: 'INTRO', pause: 'PAUSE', outro: 'OUTRO' };
        
        Object.keys(mediaScenes).forEach(key => {
            const html = `
                <div class="flex flex-col gap-2 bg-gray-900 p-3 rounded border border-gray-700">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <label class="text-xs font-bold text-gray-300"><i class="fa-solid fa-film mr-1 text-gray-500"></i> ${sceneNames[key]}</label>
                        <button id="${key}VisibilityBtn" onclick="toggleMediaVisibility('${key}')" class="text-blue-400 hover:text-blue-300 transition px-2" title="Sembunyikan/Tampilkan Video">
                            <i class="fa-solid fa-eye" id="${key}EyeIcon"></i>
                        </button>
                    </div>
                    
                    <input type="file" id="${key}Input" accept="video/mp4, video/webm" class="block w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-gray-800 file:text-white border border-gray-700 rounded cursor-pointer">
                    
                    <div class="flex gap-3 items-end mt-1">
                        <div class="flex-grow">
                            <label class="flex justify-between text-[10px] font-semibold text-gray-400 mb-1">
                                <span>Kecepatan Muncul/Hilang</span>
                                <span id="${key}SpeedLbl" class="text-blue-400">Normal</span>
                            </label>
                            <input type="range" id="${key}FadeSpeed" min="0.01" max="0.3" step="0.01" value="0.1" class="w-full accent-blue-500 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer" oninput="updateMediaFadeSpeed('${key}', this.value)">
                        </div>
                        <div class="w-24 flex-shrink-0">
                            <label class="block text-[10px] font-semibold text-gray-400 mb-1">Putar</label>
                            <select id="${key}Playback" class="w-full bg-gray-800 border border-gray-700 text-white rounded text-xs py-1.5 px-1 focus:outline-none focus:border-blue-500 cursor-pointer">
                                <option value="loop">Looping</option>
                                <option value="once">1x (Hitam)</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
            mediaInputsContainer.insertAdjacentHTML('beforeend', html);
        });

        window.toggleMediaVisibility = function(key) {
            initAudio(); // Bangunkan mesin audio
            window.mediaState[key].visible = !window.mediaState[key].visible;
            const icon = document.getElementById(`${key}EyeIcon`);
            const btn = document.getElementById(`${key}VisibilityBtn`);
            const vid = mediaScenes[key];

            if (window.mediaState[key].visible) {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                btn.classList.remove('text-gray-600');
                btn.classList.add('text-blue-400');
                
                if (vid.src) {
                    vid.currentTime = 0;
                    vid.play().catch(e => console.log("Menunggu play"));
                }
            } else {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                btn.classList.remove('text-blue-400');
                btn.classList.add('text-gray-600');
                
                if (vid.src) vid.pause();
            }
        };

        window.updateMediaFadeSpeed = function(key, val) {
            const numVal = parseFloat(val);
            window.mediaState[key].fadeSpeed = numVal;
            let label = "Normal";
            if (numVal < 0.06) label = "Lambat";
            else if (numVal > 0.15) label = "Cepat";
            document.getElementById(`${key}SpeedLbl`).innerText = label;
        };

        // UI Variables
        const btnStartCam = document.getElementById('btnStartCam');
        const btnStopCam = document.getElementById('btnStopCam');
        const btnRecord = document.getElementById('btnRecord');
        const btnStopRecord = document.getElementById('btnStopRecord');
        const statusBadge = document.getElementById('statusBadge');
        
        // Timer
        const btnToggleTimer = document.getElementById('btnToggleTimer');
        const btnResetTimer = document.getElementById('btnResetTimer');
        const timerColorInput = document.getElementById('timerColor');
        const timerAlphaInput = document.getElementById('timerAlphaInput');
        const lblTimerAlpha = document.getElementById('lblTimerAlpha');
        let timerActive = false;
        let timerSeconds = 0;
        let lastTimerUpdate = 0; 
        
        const timerOverlay = {
            type: 'timer', x: 50, y: 50, baseSize: 40, scale: 1,
            color: timerColorInput.value, alpha: parseFloat(timerAlphaInput.value)
        };

        let stream = null;
        let animationFrameId = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let currentScene = 'live'; 
        let transitionState = 0; 
        let transitionAlpha = 0;
        let pendingScene = null;
        let sceneFadeSpeed = parseFloat(document.getElementById('sceneSpeedInput').value);
        let overlayFadeSpeed = parseFloat(document.getElementById('overlaySpeedInput').value);

        // Update Variabel Speed Saat Slider Berubah
        document.getElementById('sceneSpeedInput').addEventListener('input', (e) => {
            sceneFadeSpeed = parseFloat(e.target.value);
            let label = "Normal";
            if(sceneFadeSpeed < 0.03) label = "Sangat Lambat";
            else if(sceneFadeSpeed < 0.06) label = "Lambat";
            else if(sceneFadeSpeed > 0.1) label = "Cepat";
            document.getElementById('lblSceneSpeed').innerText = label;
        });

        document.getElementById('overlaySpeedInput').addEventListener('input', (e) => {
            overlayFadeSpeed = parseFloat(e.target.value);
            let label = "Normal";
            if(overlayFadeSpeed < 0.05) label = "Sangat Lambat";
            else if(overlayFadeSpeed < 0.1) label = "Lambat";
            else if(overlayFadeSpeed > 0.2) label = "Cepat";
            document.getElementById('lblOverlaySpeed').innerText = label;
        });

        // Apply Media Listeners
        Object.keys(mediaScenes).forEach(key => {
            const input = document.getElementById(`${key}Input`);
            const select = document.getElementById(`${key}Playback`);
            const vid = mediaScenes[key];

            vid.loop = (select.value === 'loop');
            select.addEventListener('change', (e) => vid.loop = (e.target.value === 'loop'));
            
            input.addEventListener('change', (e) => {
                initAudio(); // Bangunkan mesin audio saat masukin file
                const file = e.target.files[0];
                if (file) {
                    vid.src = URL.createObjectURL(file);
                    if (currentScene === key && transitionState === 0 && window.mediaState[key].visible) vid.play();
                }
            });
        });

        // --- MANAJEMEN OVERLAYS (GAMBAR) ---
        const overlayInput = document.getElementById('overlayInput');
        const overlayList = document.getElementById('overlayList');
        const emptyOverlayMsg = document.getElementById('emptyOverlayMsg');
        
        overlayInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            const objectURL = URL.createObjectURL(file);
            
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                if (h > 200) {
                    const ratio = 200 / h;
                    h = 200;
                    w = w * ratio;
                }

                const newOverlay = {
                    id: Date.now(),
                    type: 'image',
                    name: file.name,
                    img: img,
                    x: canvas.width / 2 - w / 2, 
                    y: canvas.height / 2 - h / 2,
                    w: w,
                    h: h,
                    scale: 1,
                    visible: true,
                    alpha: 0.0 
                };
                
                overlays.push(newOverlay);
                renderOverlayListUI();
                overlayInput.value = ""; 
            };
            img.src = objectURL;
        });

        // --- MANAJEMEN OVERLAYS (TEKS) ---
        const textInput = document.getElementById('textInput');
        const fontSelect = document.getElementById('fontSelect');
        const textColor = document.getElementById('textColor');
        const btnAddText = document.getElementById('btnAddText');
        const btnClearOverlays = document.getElementById('btnClearOverlays');

        btnAddText.addEventListener('click', () => {
            const textVal = textInput.value.trim();
            if (!textVal) return;

            const baseSize = 50; 
            ctx.font = `bold ${baseSize}px ${fontSelect.value}`;
            const textWidth = ctx.measureText(textVal).width;

            const newOverlay = {
                id: Date.now(),
                type: 'text',
                name: textVal,
                text: textVal,
                font: fontSelect.value,
                color: textColor.value,
                x: canvas.width / 2 - textWidth / 2, 
                y: canvas.height / 2 - baseSize / 2,
                w: textWidth,
                h: baseSize,
                baseSize: baseSize,
                scale: 1,
                visible: true,
                alpha: 0.0 
            };
            
            overlays.push(newOverlay);
            renderOverlayListUI();
            textInput.value = ""; 
        });

        btnClearOverlays.addEventListener('click', () => {
            overlays = [];
            renderOverlayListUI();
        });

        window.toggleOverlay = function(id) {
            const ov = overlays.find(o => o.id === id);
            if (ov) {
                ov.visible = !ov.visible;
                renderOverlayListUI();
            }
        };

        window.deleteOverlay = function(id) {
            overlays = overlays.filter(ov => ov.id !== id);
            renderOverlayListUI();
        };

        window.updateOverlayScale = function(id, scaleVal) {
            const ov = overlays.find(o => o.id === id);
            if (ov) ov.scale = scaleVal;
        };

        function renderOverlayListUI() {
            emptyOverlayMsg.style.display = overlays.length === 0 ? 'block' : 'none';
            Array.from(overlayList.children).forEach(child => {
                if(child.id !== 'emptyOverlayMsg') child.remove();
            });

            const reversedOverlays = [...overlays].reverse();

            reversedOverlays.forEach(ov => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-gray-800 p-3 mb-2 rounded border border-gray-700 shadow-sm";
                
                let displayName = ov.name;
                if(displayName.length > 25) displayName = displayName.substring(0, 25) + '...';
                
                const iconType = ov.type === 'text' ? 'fa-font text-blue-400' : 'fa-image text-green-400';

                div.innerHTML = `
                    <div class="flex flex-col flex-1 mr-4">
                        <span class="text-sm font-semibold text-gray-200 mb-2"><i class="fa-solid ${iconType} mr-2"></i> ${displayName}</span>
                        <input type="range" min="0.2" max="3" step="0.1" value="${ov.scale}" 
                               class="w-full accent-blue-500 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer" 
                               oninput="updateOverlayScale(${ov.id}, this.value)">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleOverlay(${ov.id})" class="${ov.visible ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-600 hover:bg-gray-700'} text-white w-10 h-10 rounded text-sm transition shadow" title="Show/Hide">
                            <i class="fa-solid ${ov.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
                        </button>
                        <button onclick="deleteOverlay(${ov.id})" class="bg-red-600 hover:bg-red-700 text-white w-10 h-10 rounded text-sm transition shadow" title="Hapus">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                overlayList.appendChild(div);
            });
        }

        // --- LOGIKA DRAG & DROP OVERLAY ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function handleDragStart(e) {
            const coords = getCanvasCoords(e);
            
            if (timerActive || timerSeconds > 0) {
                ctx.font = `bold ${timerOverlay.baseSize * timerOverlay.scale}px monospace`;
                const timerWidth = ctx.measureText(formatTime(timerSeconds)).width;
                const timerHeight = timerOverlay.baseSize * timerOverlay.scale;

                if (coords.x >= timerOverlay.x && coords.x <= timerOverlay.x + timerWidth &&
                    coords.y >= timerOverlay.y && coords.y <= timerOverlay.y + timerHeight) {
                    dragTarget = timerOverlay;
                    dragOffsetX = coords.x - timerOverlay.x;
                    dragOffsetY = coords.y - timerOverlay.y;
                    if(e.cancelable) e.preventDefault(); 
                    return;
                }
            }

            for (let i = overlays.length - 1; i >= 0; i--) {
                const ov = overlays[i];
                if (!ov.visible) continue; 
                
                let currentW, currentH;
                if (ov.type === 'image') {
                    currentW = ov.w * ov.scale;
                    currentH = ov.h * ov.scale;
                } else {
                    ctx.font = `bold ${ov.baseSize * ov.scale}px ${ov.font}`;
                    currentW = ctx.measureText(ov.text).width;
                    currentH = ov.baseSize * ov.scale;
                }
                
                if (coords.x >= ov.x && coords.x <= ov.x + currentW &&
                    coords.y >= ov.y && coords.y <= ov.y + currentH) {
                    dragTarget = ov;
                    dragOffsetX = coords.x - ov.x;
                    dragOffsetY = coords.y - ov.y;
                    if(e.cancelable) e.preventDefault(); 
                    return;
                }
            }
        }

        function handleDragMove(e) {
            if (!dragTarget) return;
            if(e.cancelable) e.preventDefault();
            const coords = getCanvasCoords(e);
            dragTarget.x = coords.x - dragOffsetX;
            dragTarget.y = coords.y - dragOffsetY;
        }

        function handleDragEnd(e) { dragTarget = null; }

        canvas.addEventListener('mousedown', handleDragStart);
        canvas.addEventListener('mousemove', handleDragMove);
        window.addEventListener('mouseup', handleDragEnd);

        canvas.addEventListener('touchstart', handleDragStart, { passive: false });
        canvas.addEventListener('touchmove', handleDragMove, { passive: false });
        window.addEventListener('touchend', handleDragEnd);

        // --- MANAJEMEN SCENE & LOGIKA MUTE MIC OTOMATIS ---
        window.changeScene = function(scene) {
            initAudio(); // Pastikan audio aktif
            if (currentScene === scene) return; 
            pendingScene = scene;
            transitionState = 1; 

            document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btnScene' + scene.charAt(0).toUpperCase() + scene.slice(1)).classList.add('active');
        };

        function executeSceneChange() {
            currentScene = pendingScene;
            if (currentScene === 'live' && !stream) camOffPlaceholder.classList.remove('hidden');
            else camOffPlaceholder.classList.add('hidden');

            // FITUR MIC OTOMATIS MATI KECUALI DI SCENE LIVE
            if (stream) {
                stream.getAudioTracks().forEach(track => {
                    track.enabled = (currentScene === 'live');
                });
            }

            Object.values(mediaScenes).forEach(vid => vid.pause());
            
            if (mediaScenes[currentScene]) {
                const activeVid = mediaScenes[currentScene];
                const state = window.mediaState[currentScene];
                if(state.visible) {
                    activeVid.currentTime = 0; 
                    activeVid.play().catch(e => console.log("Menunggu file"));
                }
            }
        }

        // --- FUNGSI KAMERA ---
        btnStartCam.addEventListener('click', async () => {
            try {
                initAudio(); // Aktifkan Audio Context
                const constraints = {
                    video: { facingMode: "environment", width: { ideal: currentCamWidth }, height: { ideal: currentCamHeight } },
                    audio: { echoCancellation: true, noiseSuppression: true }
                };
                camPlaceholderText.innerText = "Mengakses Kamera...";
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    
                    // Colokkan Mic ke Mixer Rekaman HANYA, speaker tetap senyap
                    if (stream.getAudioTracks().length > 0 && !micNode) {
                        micNode = audioCtx.createMediaStreamSource(stream);
                        micNode.connect(mixedAudioDest);
                    }

                    // Terapkan aturan Mute/Unmute Mic berdasarkan scene aktif
                    stream.getAudioTracks().forEach(track => {
                        track.enabled = (currentScene === 'live');
                    });

                    if (currentScene === 'live') camOffPlaceholder.classList.add('hidden');
                    btnStartCam.classList.add('hidden');
                    btnStopCam.classList.remove('hidden');
                    updateStatus(`Kamera Aktif (${video.videoWidth}x${video.videoHeight})`, 'text-green-400', 'fa-video');
                };
            } catch (err) { 
                console.error(err);
                camPlaceholderText.innerText = "Kamera Belum Aktif";
                alert("Gagal akses kamera Bos!"); 
            }
        });

        btnStopCam.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            stream = null;
            if (micNode) {
                micNode.disconnect();
                micNode = null;
            }
            if (currentScene === 'live') camOffPlaceholder.classList.remove('hidden');
            btnStartCam.classList.remove('hidden');
            btnStopCam.classList.add('hidden');
            updateStatus('Standby', 'text-gray-300', 'fa-circle');
            camPlaceholderText.innerText = "Kamera Belum Aktif";
        });

        function updateStatus(text, colorClass, iconClass) {
            statusBadge.innerHTML = `<i class="fa-solid ${iconClass} ${colorClass} mr-1 text-[10px]"></i> ${text}`;
        }

        // --- ENGINE RENDER & ANIMASI (LOOP UTAMA) ---
        function drawFrame() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (currentScene === 'live') {
                if (stream && !video.paused) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else if (mediaScenes[currentScene]) {
                const activeVid = mediaScenes[currentScene];
                const playbackSelect = document.getElementById(`${currentScene}Playback`);
                const state = window.mediaState[currentScene];
                
                // PERBAIKAN FADE SCENE MP4: Gunakan Math.min dan Math.max biar presisi dan tidak loncat
                if (state.visible) {
                    state.alpha = Math.min(1.0, state.alpha + state.fadeSpeed);
                } else {
                    state.alpha = Math.max(0.0, state.alpha - state.fadeSpeed);
                }
                
                if (activeVid.src) {
                    if (activeVid.ended && playbackSelect.value === 'once') { } 
                    else if (state.alpha > 0.0) {
                        ctx.globalAlpha = state.alpha;
                        ctx.drawImage(activeVid, 0, 0, canvas.width, canvas.height);
                        ctx.globalAlpha = 1.0; 
                    }
                }
            }

            if (transitionState > 0) {
                // PERBAIKAN FADE TRANISISI SCENE:
                if (transitionState === 1) {
                    transitionAlpha = Math.min(1.0, transitionAlpha + sceneFadeSpeed);
                    if (transitionAlpha >= 1.0) {
                        executeSceneChange();
                        transitionState = 2; 
                    }
                } else if (transitionState === 2) {
                    transitionAlpha = Math.max(0.0, transitionAlpha - sceneFadeSpeed);
                    if (transitionAlpha <= 0.0) {
                        transitionState = 0; 
                    }
                }
                ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            overlays.forEach(ov => {
                // PERBAIKAN FADE OVERLAY:
                if (ov.visible) {
                    ov.alpha = Math.min(1.0, ov.alpha + overlayFadeSpeed);
                } else {
                    ov.alpha = Math.max(0.0, ov.alpha - overlayFadeSpeed);
                }

                if (ov.alpha > 0.0) { 
                    ctx.globalAlpha = ov.alpha;
                    
                    let currentW, currentH;

                    if (ov.type === 'image') {
                        currentW = ov.w * ov.scale;
                        currentH = ov.h * ov.scale;
                        ctx.drawImage(ov.img, ov.x, ov.y, currentW, currentH);
                    } 
                    else if (ov.type === 'text') {
                        const currentSize = ov.baseSize * ov.scale;
                        ctx.font = `bold ${currentSize}px ${ov.font}`;
                        ctx.fillStyle = ov.color;
                        ctx.textBaseline = 'top'; 
                        
                        currentW = ctx.measureText(ov.text).width;
                        currentH = currentSize;
                        
                        ctx.shadowColor = "rgba(0,0,0,0.8)";
                        ctx.shadowBlur = 4;
                        ctx.shadowOffsetX = 2;
                        ctx.shadowOffsetY = 2;

                        ctx.fillText(ov.text, ov.x, ov.y);
                        
                        ctx.shadowColor = "transparent";
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetX = 0;
                        ctx.shadowOffsetY = 0;
                    }
                    
                    if (ov === dragTarget && ov.visible) {
                        ctx.strokeStyle = "rgba(255, 235, 59, 0.8)";
                        ctx.lineWidth = 4;
                        ctx.strokeRect(ov.x, ov.y, currentW, currentH);
                    }
                    ctx.globalAlpha = 1.0; 
                }
            });

            if (timerActive || timerSeconds > 0) {
                if (timerActive) {
                    const now = Date.now();
                    const diff = Math.floor((now - lastTimerUpdate) / 1000);
                    if (diff > 0) {
                        timerSeconds += diff;
                        lastTimerUpdate = now;
                    }
                }

                const timerText = formatTime(timerSeconds);
                const currentSize = timerOverlay.baseSize * timerOverlay.scale;
                
                ctx.globalAlpha = timerOverlay.alpha; 
                ctx.font = `bold ${currentSize}px monospace`;
                ctx.fillStyle = timerOverlay.color;
                ctx.textBaseline = 'top';

                const timerWidth = ctx.measureText(timerText).width;
                const timerHeight = currentSize;

                ctx.shadowColor = "rgba(0,0,0,0.9)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                ctx.fillText(timerText, timerOverlay.x, timerOverlay.y);

                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.globalAlpha = 1.0; 

                if (timerOverlay === dragTarget) {
                    ctx.strokeStyle = "rgba(255, 235, 59, 0.8)";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(timerOverlay.x, timerOverlay.y, timerWidth, timerHeight);
                }
            }

            if (isRecording) {
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(canvas.width - 40, 40, 10, 0, 2 * Math.PI);
                ctx.fill();
            }

            animationFrameId = requestAnimationFrame(drawFrame);
        }

        drawFrame();

        // --- MANAJEMEN PEREKAMAN DENGAN AUDIO GABUNGAN ---
        btnRecord.addEventListener('click', () => {
            initAudio(); // Pastikan audio aktif sebelum ngerekam
            const canvasStream = canvas.captureStream(30);
            
            // Tarik output dari "Mixer Studio" kita (Suara MP4 + Suara Mic)
            if (mixedAudioDest && mixedAudioDest.stream.getAudioTracks().length > 0) {
                canvasStream.addTrack(mixedAudioDest.stream.getAudioTracks()[0]);
            } else if (stream && stream.getAudioTracks().length > 0) {
                // Fallback darurat
                canvasStream.addTrack(stream.getAudioTracks()[0]);
            }

            const options = { mimeType: 'video/webm; codecs=vp9' };
            try { mediaRecorder = new MediaRecorder(canvasStream, options); } 
            catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = saveRecording;

            mediaRecorder.start();
            isRecording = true;

            btnRecord.classList.add('hidden');
            btnStopRecord.classList.remove('hidden');
            updateStatus('Merekam...', 'text-red-500', 'fa-circle-dot');
        });

        btnStopRecord.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                btnRecord.classList.remove('hidden');
                btnStopRecord.classList.add('hidden');
                updateStatus(stream ? `Kamera Aktif (${currentCamWidth}x${currentCamHeight})` : 'Standby', stream ? 'text-green-400' : 'text-gray-300', stream ? 'fa-video' : 'fa-circle');
            }
        });

        function saveRecording() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style = 'display: none';
            a.href = url;
            const resLabel = currentCamHeight + 'p';
            a.download = `Kajian_Pro_${resLabel}_${new Date().getTime()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            }, 100);
        }

        // PENDAFTARAN SERVICE WORKER UNTUK PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker sukses!'))
                    .catch(err => console.log('ServiceWorker gagal:', err));
            });
        }
    </script>
</body>
